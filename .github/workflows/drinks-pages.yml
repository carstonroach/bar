name: Publish drinks menu
on:
  push:
    branches: [main]
    paths: ['guest-drinks/**', '.github/workflows/drinks-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: drinks-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: guest-drinks
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
